[package]
name = "reelforge-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sergii-ziborov/ReelForge-Host"
homepage = "https://github.com/sergii-ziborov/ReelForge-Host"
rust-version = "1.97"
authors = ["Sergii Ziborov"]
description = "Host process: video + photo → SightLoom → Intelligence → ReelForge encode"
keywords = ["video", "privacy", "sightloom", "reelforge", "mcp"]
categories = ["multimedia", "multimedia::video", "command-line-utilities"]
readme = "README.md"

[[bin]]
name = "reelforge-host"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reelforge = { path = "../ReelForge/crates/reelforge" }
reelforge-intelligence-core = { path = "../ReelForge-Intelligence/crates/reelforge-intelligence-core" }
reelforge-intelligence-sightloom = { path = "../ReelForge-Intelligence/crates/reelforge-intelligence-sightloom" }
sightloom = { path = "../SightLoom/crates/sightloom", default-features = false, features = ["std"] }
sightloom-host = { path = "../SightLoom/crates/sightloom-host", features = ["onnx", "image-decode"] }
sightloom-index = { path = "../SightLoom/crates/sightloom-index", default-features = false, features = ["std", "package"] }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "host"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
