name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
        with:
          path: host
      - name: checkout ReelForge sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/ReelForge
          ref: eebf944a97a2dac8136915e79406a146ca853550
          path: ReelForge
      - name: checkout SightLoom sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/SightLoom
          ref: 8ee820909d943a69f0dad78df3bf755107a9c5cb
          path: SightLoom
      - name: checkout Intelligence sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/ReelForge-Intelligence
          ref: 65f218b2e000bee391aabbbcea91d6575c20da9a
          path: ReelForge-Intelligence
      - name: checkout Capture sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/ReelForge-Capture
          ref: a7edd0f39a3b9acefee869bc95cad5e26ab5749b
          path: ReelForge-Capture
      - name: checkout graph sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/weavatrix-graph
          ref: 38d034669138e1260e42db0cd3a4200d5977d41a
          path: weavatrix-graph
      - name: checkout memory sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/weavatrix-memory
          ref: 905c933ed70c05d3905f309bffee2e2ddcda3209
          path: weavatrix-memory
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: test
        run: cargo test
      - name: bench compile
        run: cargo bench --bench host --no-run
      - name: cli smoke
        run: |
          cargo run -- version
          cargo run -- methods
          cargo run -- dispatch --method list_methods --args '{}'
