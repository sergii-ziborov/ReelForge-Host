name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
        with:
          path: host
      - name: checkout ReelForge sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/ReelForge
          ref: 314107ccfe8b16bc3c85f1cc628822601f4f2bc8
          path: ReelForge
      - name: checkout SightLoom sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/SightLoom
          ref: 00706805873cf87af959882ff78491dbd626a456
          path: SightLoom
      - name: checkout Intelligence sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/ReelForge-Intelligence
          ref: d48b2d733ec2e8af12400dbe7fe61ce8b89a50a3
          path: ReelForge-Intelligence
      - name: checkout Capture sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/ReelForge-Capture
          ref: 645ed25adc1e007dde9c50fae67f8c5acd0203c7
          path: ReelForge-Capture
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: bench compile
        run: cargo bench --bench host --no-run
      - name: cli smoke
        run: |
          cargo run -- version
          cargo run -- methods
          cargo run -- dispatch --method list_methods --args '{}'
