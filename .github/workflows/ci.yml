name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
        with:
          path: host
      - name: checkout ReelForge sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/ReelForge
          ref: eb2fe0b2a083b57814d260823bbf138bc6622803
          path: ReelForge
      - name: checkout SightLoom sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/SightLoom
          ref: 8ee820909d943a69f0dad78df3bf755107a9c5cb
          path: SightLoom
      - name: checkout Intelligence sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/ReelForge-Intelligence
          ref: 8416ef7e6ca7da38759c096723cd79a33774c44c
          path: ReelForge-Intelligence
      - name: checkout Capture sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/ReelForge-Capture
          ref: a7edd0f39a3b9acefee869bc95cad5e26ab5749b
          path: ReelForge-Capture
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: test
        run: cargo test
      - name: bench compile
        run: cargo bench --bench host --no-run
      - name: cli smoke
        run: |
          cargo run -- version
          cargo run -- methods
          cargo run -- dispatch --method list_methods --args '{}'
