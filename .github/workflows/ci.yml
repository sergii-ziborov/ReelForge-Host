name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
        with:
          path: host
      - name: checkout ReelForge sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/ReelForge
          ref: 89e0de3b711f8ef5b08f2730dad224926ea20c2f
          path: ReelForge
      - name: checkout SightLoom sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/SightLoom
          ref: d5cbbde00f80e644b461b4d5f45d7e5254bc367c
          path: SightLoom
      - name: checkout Intelligence sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/ReelForge-Intelligence
          ref: d48b2d733ec2e8af12400dbe7fe61ce8b89a50a3
          path: ReelForge-Intelligence
      - name: checkout Capture sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/ReelForge-Capture
          ref: a7edd0f39a3b9acefee869bc95cad5e26ab5749b
          path: ReelForge-Capture
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: test
        run: cargo test
      - name: bench compile
        run: cargo bench --bench host --no-run
      - name: cli smoke
        run: |
          cargo run -- version
          cargo run -- methods
          cargo run -- dispatch --method list_methods --args '{}'
