name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
        with:
          path: host
      - name: checkout ReelForge sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/ReelForge
          path: ReelForge
      - name: checkout SightLoom sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/SightLoom
          path: SightLoom
      - name: checkout Intelligence sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/ReelForge-Intelligence
          path: ReelForge-Intelligence
      - name: checkout Capture sibling
        uses: actions/checkout@v4
        with:
          repository: sergii-ziborov/ReelForge-Capture
          path: ReelForge-Capture
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: bench compile
        run: cargo bench --bench host --no-run
      - name: cli smoke
        run: |
          cargo run -- version
          cargo run -- methods
          cargo run -- dispatch --method list_methods --args '{}'
